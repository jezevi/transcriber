name: TransCheck build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (rules, config, self-test logic)
        shell: bash
        run: |
          python -m unittest discover -s tests -t . -p "test_numbers.py" -v
          python -m unittest discover -s tests -t . -p "test_rules.py" -v
          python -m unittest discover -s tests -t . -p "test_config.py" -v

      - name: Tests (windows and orchestration on real Tk)
        continue-on-error: true
        shell: bash
        run: |
          python -m unittest discover -s tests -t . -p "test_ui.py" -v
          python -m unittest discover -s tests -t . -p "test_app.py" -v
          python -m unittest discover -s tests -t . -p "test_selftest.py" -v

      - name: Install PyInstaller
        shell: bash
        run: python -m pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: >-
          pyinstaller --onefile --noconsole --clean --name TransCheck
          --hidden-import transcheck.winapi --hidden-import transcheck.ui
          --hidden-import transcheck.selftest --hidden-import transcheck.app run.py

      - name: Self-test of the built exe
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $p = Start-Process -FilePath dist\TransCheck.exe -ArgumentList '--selftest','--quiet','--out','selftest_ci.txt' -Wait -PassThru
          "exit code: $($p.ExitCode)"
          if (-not (Test-Path selftest_ci.txt)) { throw 'The exe did not produce selftest_ci.txt: it does not start' }
          $t = Get-Content selftest_ci.txt -Encoding UTF8 -Raw
          Write-Host $t
          if ($t -match 'ModuleNotFoundError|ImportError|No module named') { throw 'A module is missing inside the exe' }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TransCheck | Out-Null
          Copy-Item dist\TransCheck.exe TransCheck\
          Copy-Item README.md TransCheck\
          python -c "from transcheck import config; open('TransCheck/rules_extra.txt','w',encoding='utf-8').write(config.RULES_EXTRA_TEMPLATE)"

      - uses: actions/upload-artifact@v4
        with:
          name: TransCheck-windows
          path: TransCheck
